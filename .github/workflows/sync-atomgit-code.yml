name: Sync Code to AtomGit

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-atomgit-code:
    name: Sync main and release tags
    runs-on: ubuntu-latest
    concurrency:
      group: atomgit-code-sync
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check AtomGit credentials
        id: atomgit-check
        shell: bash
        run: |
          missing=""
          if [ -z "${{ secrets.ATOMGIT_ACCESS_TOKEN }}" ]; then missing="$missing ATOMGIT_ACCESS_TOKEN"; fi
          if [ -z "${{ vars.ATOMGIT_OWNER }}" ]; then missing="$missing ATOMGIT_OWNER"; fi
          if [ -z "${{ vars.ATOMGIT_REPO }}" ]; then missing="$missing ATOMGIT_REPO"; fi
          if [ -n "$missing" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::AtomGit credentials not configured ($missing); skipping sync."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync code to AtomGit
        if: steps.atomgit-check.outputs.configured == 'true'
        env:
          ATOMGIT_USERNAME: ${{ vars.ATOMGIT_USERNAME || vars.ATOMGIT_OWNER }}
          ATOMGIT_ACCESS_TOKEN: ${{ secrets.ATOMGIT_ACCESS_TOKEN }}
          ATOMGIT_OWNER: ${{ vars.ATOMGIT_OWNER }}
          ATOMGIT_REPO: ${{ vars.ATOMGIT_REPO }}
        run: node .github/scripts/sync-atomgit-git.mjs
