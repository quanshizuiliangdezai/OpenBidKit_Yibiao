name: Build & Publish (our channel)

# 自有更新渠道的打包发版流水线。
# 触发：push 到 main 时自动构建并发布 Windows 安装包到咱们自己的 Release 渠道；
#       也可在 Actions 页面手动 Run workflow 强制构建。
# 同事软件的设置里保持默认 GitHub 渠道（即咱们仓库），即可自动更新。
#
# 本仓库已是 FB208/OpenBidKit_Yibiao 的真正 fork（共享历史）。
# 上游新功能自动合并由 sync-upstream.yml 处理（每天 08:00 UTC+8）。

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_build:
        description: '强制构建并发布（即使无新提交）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout (our repo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Git identity
        run: |
          git config user.name "yibiao-ci"
          git config user.email "ci@yibiao.local"

      - name: Write sync config from secret
        shell: bash
        # secrets.YIBIAO_SYNC_CONFIG 示例：{"baseUrl":"http://59.49.48.147:15004","authToken":"yibiao-sync-2026","uploadPath":"/sync/upload","downloadPath":"/sync/download","manifestPath":"/sync/yibiao/manifest"}
        run: echo '${{ secrets.YIBIAO_SYNC_CONFIG }}' > client/electron/sync-config.local.json

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Rebuild Electron native dependencies
        working-directory: client
        run: npm run postinstall

      - name: Smoke test Electron native dependencies
        working-directory: client
        run: npm run smoke:electron-native

      - name: Verify bundled agent tools
        working-directory: client
        run: npm run verify-agent-tools -- --platform win32 --arch x64

      - name: Set build version (semantic, v1.x / v1.x.x)
        working-directory: client
        shell: bash
        run: |
          # 读取当前版本，默认 1.0.0
          CURRENT=$(node -p "require('./package.json').version || '1.0.0'")
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)

          # 根据本次提交信息判断 bump 级别
          COMMIT_MSG='${{ github.event.head_commit.message }}'
          BUMP="patch"
          if printf '%s' "$COMMIT_MSG" | grep -qiE 'BREAKING CHANGE|!:'; then
            BUMP="major"
          elif printf '%s' "$COMMIT_MSG" | grep -qiE '^feat(\([^)]*\))?:|^feature(\([^)]*\))?:|upstream|sync.*upstream|merge.*upstream'; then
            BUMP="minor"
          fi

          case "$BUMP" in
            major)
              MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor)
              MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch)
              PATCH=$((PATCH + 1)) ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "Bumping version: $CURRENT -> $NEW_VERSION (trigger: $BUMP)"
          npm version "$NEW_VERSION" --no-git-tag-version --allow-same-version

      - name: Commit version bump
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          git config user.name "yibiao-ci"
          git config user.email "ci@yibiao.local"
          git add client/package.json client/package-lock.json
          NEW_VERSION=$(node -p "require('./client/package.json').version")
          git commit -m "chore(release): bump version to v${NEW_VERSION} [skip ci]" || echo "Nothing to commit"
          git push origin main || echo "Push skipped"

      - name: Build renderer
        working-directory: client
        run: npm run build

      - name: Build & publish Windows installer
        working-directory: client
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis zip --publish always

      - name: Verify packaged agent tools
        working-directory: client
        run: npm run verify-packaged-agent-tools -- --platform win32 --arch x64 --release release
